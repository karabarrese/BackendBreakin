services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: breach_lab
    volumes:
      - ./attack/setup_lab.sql:/docker-entrypoint-initdb.d/10_setup_lab.sql:ro
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      LAB_DB_HOST: db
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - db